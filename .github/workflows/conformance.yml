name: Native exact-head conformance

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [ores-otel-conformance]

permissions:
  contents: read

concurrency:
  group: native-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: rust / ${{ matrix.role }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: ores-otel/ores.otel.log
            ref: 05f14768232b770dfc2bbe03f27b388f5a701c74
            role: canonical
          - repository: ORESoftware/next-loggers.ts
            ref: 05f14768232b770dfc2bbe03f27b388f5a701c74
            role: legacy
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate shared JSON Schema and SDK API manifests
        working-directory: source
        run: |
          python -m pip install --disable-pip-version-check jsonschema==4.26.0 referencing==0.37.0
          python scripts/validate-contracts.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - run: cargo fmt --manifest-path source/sdk/rust/Cargo.toml -- --check
      - run: cargo test --manifest-path source/sdk/rust/Cargo.toml --locked
      - run: cargo clippy --manifest-path source/sdk/rust/Cargo.toml --all-targets -- -D warnings
      - name: Record exact source
        run: printf '%s %s %s %s
' ores-otel-log-rust-test rust "${{ matrix.role }}" "${{ matrix.ref }}"
