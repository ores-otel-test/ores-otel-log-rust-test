[package]
name = "ores-otel-web-consumer-test"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
default = []
native = ["ores-otel-web/axum"]
browser = ["ores-otel-web/browser"]

[dependencies]
ores-otel-web = { git = "https://github.com/ores-otel/ores.otel.log", rev = "74bc1c421f5a56be28cade1a47f5d45de51f3b4b", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
next-loggers = { package = "oresoftware-next-loggers", git = "https://github.com/ores-otel/ores.otel.log", rev = "74bc1c421f5a56be28cade1a47f5d45de51f3b4b" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
tower = { version = "0.5", features = ["util"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["RequestInit", "RequestMode", "RequestRedirect", "RequestCredentials", "Headers"] }
