[package]
name = "ores-otel-dioxus-compile-probe"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
default = []
web = ["dioxus/web", "ores-otel-web/browser"]
ssr = ["dioxus/ssr"]

[dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["minimal"] }
ores-otel-web = { git = "https://github.com/ores-otel/ores.otel.log", rev = "74bc1c421f5a56be28cade1a47f5d45de51f3b4b", default-features = false }
